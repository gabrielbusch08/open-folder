<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Opening folder…</title>
<style>
  /* Dark, like Notion's dark theme, so the tab barely shows. */
  html, body { background: #191919; }
  body { font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; min-height: 90vh; margin: 0; color: #d4d4d4; }
  main { text-align: center; padding: 1rem; }
  a { color: #9b9b9b; }
  a.button { display: inline-block; margin: .75rem 0; padding: .6rem 1.2rem; border-radius: 6px; background: #2f6fbf; color: #fff; text-decoration: none; }
  .small { font-size: .9rem; color: #7f7f7f; }
  body.quiet main { visibility: hidden; }
</style>
</head>
<body>
<main>
  <p id="msg">Opening folder…</p>
  <a class="button" id="app" href="#">Open in Explorer</a>
  <p class="small"><a id="web" href="https://drive.google.com/">Find it in Google Drive instead</a></p>
  <p class="small" id="auto"></p>
</main>
<script>
  // Link format: https://<this page>/#<folder name>, e.g. #Notion%20Setup
  // The name is after the "#", so it never reaches the server. The page hands
  // it to the openfolder: link that install.ps1 registers on Windows; the
  // program there finds the Drive folder with that name and opens it.
  var name = location.hash.slice(1);
  try { name = decodeURIComponent(name); } catch (e) {}
  name = name.trim();
  var msg = document.getElementById('msg');
  if (name) {
    var appUrl = 'openfolder:' + encodeURIComponent(name);
    document.getElementById('app').href = appUrl;
    document.getElementById('web').href = 'https://drive.google.com/drive/search?q=' + encodeURIComponent('type:folder ' + name);
    document.title = name + ' – opening folder…';
    // Its own setting, apart from the Todoist page's: each link type gets
    // its own first "Open with?" question in Firefox.
    var auto = document.getElementById('auto');
    var autoClose = localStorage.getItem('autoCloseFolder') === 'yes';
    // Quiet mode: a blank dark tab. The text shows only if Explorer didn't take over.
    if (autoClose) {
      document.body.className = 'quiet';
      setTimeout(function () { document.body.className = ''; }, 2000);
      auto.innerHTML = 'This tab closes itself. <a href="#" id="toggle">Stop that</a>';
    } else {
      auto.innerHTML = 'Once Firefox no longer asks before opening the folder: <a href="#" id="toggle">close this tab by itself from now on</a>';
    }
    document.getElementById('toggle').addEventListener('click', function (e) {
      e.preventDefault();
      localStorage.setItem('autoCloseFolder', autoClose ? 'no' : 'yes');
      auto.textContent = autoClose ? 'Done: the tab stays open from now on.' : 'Done: from the next link on, this tab closes itself.';
    });
    var left = false;
    function gone() {
      if (left) return;
      left = true;
      msg.textContent = 'Opened in Explorer. You can close this tab.';
      if (autoClose) setTimeout(function () { window.close(); }, 300);
    }
    // Wait a moment first: Firefox may close a new tab whose very first step
    // is to hand off to another app, taking its "Open with?" question along.
    // Once auto-close is on, Firefox no longer asks, so the wait can be short.
    setTimeout(function () {
      window.addEventListener('blur', gone);
      document.addEventListener('visibilitychange', function () { if (document.hidden) gone(); });
      location.href = appUrl;
    }, autoClose ? 100 : 500);
  } else {
    msg.textContent = 'This link has no folder name after the #.';
    document.getElementById('app').style.display = 'none';
  }
</script>
</body>
</html>
